[project]
name = "urban-sdk-traffic-api"
version = "0.1.0"
description = "Geospatial traffic aggregation microservice for Duval County speed data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
notebook = [
    "geopandas>=1.1.4",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "mapboxgl>=0.10.2",
    "nbconvert>=7.17.1",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The app's DB engine is a module-level singleton bound to whatever event
# loop is running when it's first used. pytest-asyncio's default is a fresh
# loop per test, which breaks asyncpg connections reused across loops
# ("another operation is in progress"). Session-scoped keeps one loop for
# the whole run, matching the engine's lifetime.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
